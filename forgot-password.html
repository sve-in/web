<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — SVE Business Portal</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/main.css" />
<style>
  .auth-wrap { min-height: calc(100vh - 72px); display: flex; align-items: center; justify-content: center; padding: 40px 20px; background: linear-gradient(180deg,#f8fafc,#eff6ff); }
  .auth-card { background: white; border-radius: var(--radius-lg); padding: 40px; box-shadow: var(--shadow-lg); border: 1px solid var(--slate-100); max-width: 440px; width: 100%; }
  .auth-head { text-align: center; margin-bottom: 26px; }
  .auth-head h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 6px; }
  .auth-head p { color: var(--slate-500); font-size: .9rem; }
</style>
</head>
<body>

<header class="navbar" id="navbar">
  <div class="container nav-inner">
    <a href="index.html" class="brand">
      <img src="images/logo.png" alt="SVE" class="brand-logo" onerror="this.style.display='none'" />
      <div class="brand-text"><span class="brand-name">SVE <span class="brand-badge">B2B</span></span><span class="brand-sub">Business Portal</span></div>
    </a>
    <div class="nav-actions"><a href="login.html" class="btn-primary">Login</a></div>
  </div>
</header>

<section class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <h1>Reset Password</h1>
      <p>We'll send a reset link to your email.</p>
    </div>

    <div class="field" style="margin-bottom:14px;">
      <label>Registered Email</label>
      <input type="email" id="fpEmail" placeholder="you@business.com" />
    </div>

    <div id="fpErr" class="alert alert-error" hidden></div>
    <div id="fpOk" class="alert alert-success" hidden></div>

    <button class="btn-primary btn-block btn-lg" id="fpSendBtn">
      <span class="btn-text">Send Reset Link →</span>
      <span class="btn-spinner" hidden></span>
    </button>

    <div style="text-align:center;margin-top:22px;padding-top:22px;border-top:1px solid var(--slate-100);font-size:.88rem;">
      <a href="login.html" style="color:var(--blue-600);font-weight:600;">← Back to Login</a>
    </div>
  </div>
</section>

<div id="toastBox" class="toast-box"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/main.js"></script>
<script src="js/ui.js"></script>
<script>
  (function(){
    const btn = document.getElementById('fpSendBtn');
    const spinner = btn.querySelector('.btn-spinner');
    const btnText = btn.querySelector('.btn-text');
    const errBox = document.getElementById('fpErr');
    const okBox  = document.getElementById('fpOk');
    btn.addEventListener('click', async function(){
      errBox.hidden = true; okBox.hidden = true;
      const email = document.getElementById('fpEmail').value.trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        errBox.textContent = 'Please enter a valid email.'; errBox.hidden = false; return;
      }
      btn.disabled = true; spinner.hidden = false; btnText.textContent = 'Sending…';
      try {
        await window.auth.sendPasswordResetEmail(email);
        okBox.textContent = 'Reset link sent! Check your inbox (and spam).';
        okBox.hidden = false;
      } catch (e) {
        console.error(e);
        let msg = 'Could not send reset email.';
        if (e.code === 'auth/user-not-found') msg = 'No account with this email.';
        errBox.textContent = msg; errBox.hidden = false;
      } finally {
        btn.disabled = false; spinner.hidden = true; btnText.textContent = 'Send Reset Link →';
      }
    });
  })();
</script>
</body>
</html>
