<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Raise Complaint — SVE Business Portal</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/main.css" />
<style>
  .cmp-wrap { padding: 40px 0 80px; }
  .cmp-card { max-width: 640px; margin: 0 auto; background: white; border: 1px solid var(--slate-100); border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow); }
</style>
</head>
<body>

<header class="navbar" id="navbar">
  <div class="container nav-inner">
    <a href="index.html" class="brand">
      <img src="images/logo.png" alt="SVE" class="brand-logo" onerror="this.style.display='none'" />
      <div class="brand-text"><span class="brand-name">SVE <span class="brand-badge">B2B</span></span><span class="brand-sub">Business Portal</span></div>
    </a>
    <div class="nav-actions">
      <a href="my-complaints.html" class="btn-outline">My Complaints</a>
      <button class="btn-ghost" id="logoutBtn">Logout</button>
    </div>
  </div>
</header>

<section class="cmp-wrap">
  <div class="container">
    <div class="cmp-card" id="cmpContent">
      <div class="loading-block"><span class="spinner"></span> Loading…</div>
    </div>
  </div>
</section>

<div id="toastBox" class="toast-box"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/main.js"></script>
<script src="js/ui.js"></script>
<script src="js/sheets.js"></script>
<script src="js/auth.js"></script>
<script src="js/complaint.js"></script>
</body>
</html>
