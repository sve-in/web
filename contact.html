<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact Us — SVE Business Portal</title>
<meta name="description" content="Contact Siddhi Vinayak Enterprises. Business inquiries, wholesale, distributors." />
<link rel="icon" href="images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/main.css" />
</head>
<body>

<header class="navbar" id="navbar">
  <div class="container nav-inner">
    <a href="index.html" class="brand">
      <img src="images/logo.png" alt="SVE" class="brand-logo" onerror="this.style.display='none'" />
      <div class="brand-text"><span class="brand-name">SVE <span class="brand-badge">B2B</span></span><span class="brand-sub">Business Portal</span></div>
    </a>
    <div class="nav-actions"><a href="index.html" class="btn-outline">← Home</a></div>
  </div>
</header>

<section class="section" style="padding:40px 0;">
  <div class="container">
    <div style="text-align:center;margin-bottom:32px;">
      <h1 style="font-size:2rem;font-weight:800;letter-spacing:-.02em;">Contact Us</h1>
      <p style="color:var(--slate-500);margin-top:6px;">We'd love to hear from you.</p>
    </div>

    <div style="display:grid;grid-template-columns:1.2fr 1fr;gap:28px;max-width:1000px;margin:0 auto;" class="contact-grid">
      <form id="contactForm" style="background:white;border:1px solid var(--slate-100);border-radius:var(--radius);padding:28px;">
        <div class="field" style="margin-bottom:14px;"><label>Name *</label><input type="text" id="cName" required /></div>
        <div class="field" style="margin-bottom:14px;"><label>Phone *</label><input type="tel" id="cPhone" maxlength="10" required /></div>
        <div class="field" style="margin-bottom:14px;"><label>Email *</label><input type="email" id="cEmail" required /></div>
        <div class="field" style="margin-bottom:14px;"><label>Subject</label><input type="text" id="cSubject" /></div>
        <div class="field" style="margin-bottom:14px;"><label>Message *</label><textarea id="cMessage" required style="min-height:140px;"></textarea></div>
        <div id="cErr" class="alert alert-error" hidden></div>
        <button type="submit" class="btn-primary btn-block btn-lg" id="cBtn">
          <span class="btn-text">Send Message →</span><span class="btn-spinner" hidden></span>
        </button>
      </form>

      <div style="background:white;border:1px solid var(--slate-100);border-radius:var(--radius);padding:28px;">
        <h3 style="font-size:1.05rem;font-weight:800;margin-bottom:16px;">Reach Us</h3>
        <div id="contactInfo" style="line-height:1.9;color:var(--slate-700);font-size:.92rem;">
          <div>📧 Loading…</div>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="toastBox" class="toast-box"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/main.js"></script>
<script src="js/ui.js"></script>
<script src="js/sheets.js"></script>
<script src="js/contact.js"></script>
<style>@media(max-width:720px){ .contact-grid{grid-template-columns:1fr !important;} }</style>
</body>
</html>
