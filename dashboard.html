<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — SVE Business Portal</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/main.css" />
<style>
  .dash-wrap { padding: 40px 0 80px; background: #f8fafc; min-height: calc(100vh - 72px); }
  .dash-hello { font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; margin-bottom: 6px; }
  .dash-sub { color: var(--slate-500); margin-bottom: 32px; }
  .dash-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
  .stat-card { background: white; border-radius: var(--radius); padding: 22px; border: 1px solid var(--slate-100); box-shadow: var(--shadow-sm); }
  .stat-lbl { font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; color: var(--slate-500); font-weight: 700; margin-bottom: 8px; }
  .stat-val { font-size: 1.7rem; font-weight: 800; letter-spacing: -.02em; color: var(--slate-900); }
  .quick-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 32px; }
  .qa-card { background: white; border: 1px solid var(--slate-100); border-radius: var(--radius); padding: 20px; text-align: center; transition: var(--transition); }
  .qa-card:hover { border-color: var(--blue-400); transform: translateY(-2px); box-shadow: var(--shadow); }
  .qa-icon { font-size: 1.8rem; margin-bottom: 8px; }
  .qa-lbl { font-size: .88rem; font-weight: 700; color: var(--slate-900); }
  .panel { background: white; border-radius: var(--radius); border: 1px solid var(--slate-100); overflow: hidden; margin-bottom: 24px; box-shadow: var(--shadow-sm); }
  .panel-head { padding: 18px 22px; border-bottom: 1px solid var(--slate-100); display: flex; justify-content: space-between; align-items: center; }
  .panel-head h3 { font-size: 1.02rem; font-weight: 700; }
  .panel-body { padding: 20px; }
  .panel-body.p-0 { padding: 0; }
  .empty-dash { text-align: center; padding: 40px 20px; color: var(--slate-500); }
  .empty-dash .icon { font-size: 2.4rem; margin-bottom: 8px; opacity: .5; }
  @media(max-width:900px){ .dash-grid{grid-template-columns:repeat(2,1fr);} .quick-actions{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:600px){ .dash-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>

<header class="navbar" id="navbar">
  <div class="container nav-inner">
    <a href="index.html" class="brand">
      <img src="images/logo.png" alt="SVE" class="brand-logo" onerror="this.style.display='none'" />
      <div class="brand-text"><span class="brand-name">SVE <span class="brand-badge">B2B</span></span><span class="brand-sub">Business Portal</span></div>
    </a>
    <nav class="nav-links" id="navLinks">
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="products.html">Products</a>
      <a href="my-orders.html">My Orders</a>
      <a href="my-complaints.html">Complaints</a>
    </nav>
    <div class="nav-actions">
      <a href="cart.html" class="btn-ghost cart-badge cart-nav-link" data-cart-count="0">🛒 Cart</a>
      <button class="btn-outline" id="logoutBtn">Logout</button>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<section class="dash-wrap">
  <div class="container">
    <h1 class="dash-hello">Hello, <span id="userName">…</span> 👋</h1>
    <p class="dash-sub">Welcome to your partner dashboard.</p>

    <div class="dash-grid">
      <div class="stat-card">
        <div class="stat-lbl">Total Orders</div>
        <div class="stat-val" id="statOrders">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-lbl">Pending</div>
        <div class="stat-val" id="statPending" style="color:#f59e0b;">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-lbl">Total Spent</div>
        <div class="stat-val" id="statSpent">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-lbl">Open Complaints</div>
        <div class="stat-val" id="statComplaints" style="color:#ef4444;">—</div>
      </div>
    </div>

    <div class="quick-actions">
      <a href="products.html" class="qa-card">
        <div class="qa-icon">📦</div>
        <div class="qa-lbl">Browse Products</div>
      </a>
      <a href="cart.html" class="qa-card">
        <div class="qa-icon">🛒</div>
        <div class="qa-lbl">My Cart</div>
      </a>
      <a href="my-orders.html" class="qa-card">
        <div class="qa-icon">🧾</div>
        <div class="qa-lbl">My Orders</div>
      </a>
      <a href="complaint.html" class="qa-card">
        <div class="qa-icon">⚠️</div>
        <div class="qa-lbl">Raise Complaint</div>
      </a>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h3>Recent Orders</h3>
        <a href="my-orders.html" class="btn-outline" style="padding:6px 14px;font-size:.82rem;">View All →</a>
      </div>
      <div class="panel-body p-0" id="ordersBody">
        <div class="empty-dash"><div class="icon">📦</div><p>Loading…</p></div>
      </div>
    </div>
  </div>
</section>

<div id="toastBox" class="toast-box"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/main.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
