<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — SVE Business Portal</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/main.css" />
<style>
  .dash-wrap { padding: 40px 0 80px; background: #f8fafc; min-height: calc(100vh - 72px); }
  .dash-hello { font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; margin-bottom: 6px; }
  .dash-sub { color: var(--slate-500); margin-bottom: 32px; }
  .dash-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
  .stat-card { background: white; border-radius: var(--radius); padding: 24px; border: 1px solid var(--slate-100); box-shadow: var(--shadow-sm); }
  .stat-lbl { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--slate-500); font-weight: 700; margin-bottom: 8px; }
  .stat-val { font-size: 1.8rem; font-weight: 800; letter-spacing: -.02em; color: var(--slate-900); }
  .panel { background: white; border-radius: var(--radius); border: 1px solid var(--slate-100); box-shadow: var(--shadow-sm); overflow: hidden; margin-bottom: 24px; }
  .panel-head { padding: 20px 24px; border-bottom: 1px solid var(--slate-100); display: flex; justify-content: space-between; align-items: center; }
  .panel-head h3 { font-size: 1.05rem; font-weight: 700; }
  .panel-body { padding: 24px; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--slate-500); }
  .empty-state .icon { font-size: 2.5rem; margin-bottom: 8px; opacity: .5; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--slate-100); }
  th { font-weight: 700; color: var(--slate-500); font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .75rem; font-weight: 700; }
  .pill-pending   { background:#fffbeb; color:#92400e; }
  .pill-processing{ background:#eff6ff; color:#1e40af; }
  .pill-dispatched{ background:#eef2ff; color:#3730a3; }
  .pill-delivered { background:#f0fdf4; color:#166534; }
  .pill-cancelled { background:#fef2f2; color:#991b1b; }
  @media(max-width:720px){ .dash-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>

<header class="navbar" id="navbar">
  <div class="container nav-inner">
    <a href="index.html" class="brand">
      <img src="images/logo.png" alt="SVE" class="brand-logo" onerror="this.style.display='none'" />
      <div class="brand-text">
        <span class="brand-name">SVE <span class="brand-badge">B2B</span></span>
        <span class="brand-sub">Business Portal</span>
      </div>
    </a>
    <div class="nav-actions">
      <span id="userEmail" style="font-size:.85rem;color:var(--slate-500);margin-right:8px;"></span>
      <button class="btn-outline" id="logoutBtn">Logout</button>
    </div>
  </div>
</header>

<section class="dash-wrap">
  <div class="container">
    <h1 class="dash-hello">Hello, <span id="userName">…</span> 👋</h1>
    <p class="dash-sub">Welcome to your distributor dashboard.</p>

    <div class="dash-grid">
      <div class="stat-card">
        <div class="stat-lbl">Total Orders</div>
        <div class="stat-val" id="statOrders">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-lbl">Pending Orders</div>
        <div class="stat-val" id="statPending">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-lbl">Total Spent</div>
        <div class="stat-val" id="statSpent">—</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h3>Your Recent Orders</h3>
        <a href="#" class="btn-primary" style="padding:8px 16px;font-size:.85rem;">+ New Order</a>
      </div>
      <div class="panel-body" id="ordersBody">
        <div class="empty-state">
          <div class="icon">📦</div>
          <p>No orders yet. Start by placing your first order.</p>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="toastBox" class="toast-box"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
