<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account — SVE Business Portal</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/main.css" />
<style>
  .auth-wrap { min-height: calc(100vh - 72px); display: flex; align-items: center; justify-content: center; padding: 40px 20px; background: linear-gradient(180deg,#f8fafc,#eff6ff); }
  .auth-card { background: white; border-radius: var(--radius-lg); padding: 40px; box-shadow: var(--shadow-lg); border: 1px solid var(--slate-100); max-width: 480px; width: 100%; }
  .auth-head { text-align: center; margin-bottom: 28px; }
  .auth-head h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; margin-bottom: 6px; }
  .auth-head p { color: var(--slate-500); font-size: .9rem; }
  .divider { display: flex; align-items: center; text-align: center; color: var(--slate-400); margin: 20px 0; font-size: 0.85rem; }
  .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--slate-200); }
  .divider::before { margin-right: .5em; }
  .divider::after { margin-left: .5em; }
  .btn-google { display: flex; align-items: center; justify-content: center; gap: 10px; background: white; border: 1.5px solid var(--slate-300); color: var(--slate-700); font-weight: 600; padding: 11px; border-radius: 8px; width: 100%; transition: all 0.2s; cursor: pointer; }
  .btn-google:hover { background: #f8fafc; border-color: var(--slate-400); }
</style>
</head>
<body>

<header class="navbar" id="navbar">
  <div class="container nav-inner">
    <a href="index.html" class="brand">
      <img src="images/logo.png" alt="SVE" class="brand-logo" onerror="this.style.display='none'" />
      <div class="brand-text">
        <span class="brand-name">SVE <span class="brand-badge">B2B</span></span>
        <span class="brand-sub">Business Portal</span>
      </div>
    </a>
    <div class="nav-actions">
      <a href="login.html" class="btn-primary">Login</a>
    </div>
  </div>
</header>

<section class="auth-wrap">
  <div class="auth-card">
    
    <!-- FORM SECTION -->
    <div id="signupFormSection">
      <div class="auth-head">
        <h1>Create your account</h1>
        <p>Sign up to start ordering. / खाता बनाएं।</p>
      </div>

      <!-- GOOGLE SIGNUP BUTTON -->
      <button type="button" class="btn-google" id="googleSignupBtn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" style="width:18px;" />
        Sign up with Google
      </button>

      <div class="divider">or use email</div>

      <div class="field" style="margin-bottom:14px;">
        <label>Full Name *</label>
        <input type="text" id="suName" placeholder="e.g. Rajesh Kumar" />
      </div>
      <div class="field" style="margin-bottom:14px;">
        <label>Email *</label>
        <input type="email" id="suEmail" placeholder="you@business.com" />
      </div>
      <div class="field" style="margin-bottom:14px;">
        <label>Phone (10 digits) *</label>
        <input type="tel" id="suPhone" maxlength="10" inputmode="numeric" placeholder="9876543210" />
      </div>
      <div class="field" style="margin-bottom:14px;">
        <label>Business / Firm Name (optional)</label>
        <input type="text" id="suBusiness" placeholder="e.g. Kumar Traders" />
      </div>
      <div class="field" style="margin-bottom:14px;">
        <label>City (optional)</label>
        <input type="text" id="suCity" placeholder="e.g. Jaipur" />
      </div>
      <div class="field" style="margin-bottom:14px;">
        <label>Password *</label>
        <div style="position:relative;">
          <input type="password" id="suPassword" placeholder="Min 8 chars, 1 upper, 1 number" style="padding-right:44px;" />
          <button type="button" class="pass-toggle" id="suTogglePass" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--slate-500);">👁</button>
        </div>
      </div>
      <div class="field" style="margin-bottom:14px;">
        <label>Confirm Password *</label>
        <input type="password" id="suPassword2" placeholder="Re-enter password" />
      </div>

      <div id="suErr" class="alert alert-error" hidden></div>

      <button class="btn-primary btn-block btn-lg" id="suCreateBtn">
        <span class="btn-text">Create Account →</span>
        <span class="btn-spinner" hidden></span>
      </button>

      <p style="font-size:.82rem;color:var(--slate-500);text-align:center;margin-top:14px;">
        By signing up, you agree to our <a href="terms.html" style="color:var(--blue-600);">Terms</a> &amp; <a href="privacy.html" style="color:var(--blue-600);">Privacy Policy</a>.
      </p>
    </div>

    <div style="text-align:center;margin-top:22px;padding-top:22px;border-top:1px solid var(--slate-100);font-size:.88rem;color:var(--slate-500);">
      Already have an account? <a href="login.html" style="color:var(--blue-600);font-weight:600;">Login →</a>
    </div>
  </div>
</section>

<div id="toastBox" class="toast-box"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/main.js"></script>
<script src="js/ui.js"></script>
<script src="js/sheets.js"></script>
<script src="js/signup.js"></script>
<script src="js/google-auth.js"></script> <!-- NAYI FILE -->
</body>
</html>
