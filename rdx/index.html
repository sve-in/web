<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SVE Admin — Sign In</title>
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="googlebot" content="noindex, nofollow" />
<link rel="icon" href="../images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />

<link rel="stylesheet" href="css/admin.css" />
<style>
  .google-btn {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%; padding: 14px 20px;
    background: #ffffff; color: #1f2937;
    border: 1.5px solid #e5e7eb; border-radius: 8px;
    font-size: .95rem; font-weight: 600;
    transition: all .2s ease; cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
    margin-top: 8px;
  }
  .google-btn:hover {
    background: #f9fafb; border-color: #d1d5db;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    transform: translateY(-1px);
  }
  .google-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
  .google-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
  .allowed-note {
    margin-top: 20px; padding: 12px 14px;
    background: rgba(59,130,246,.08); border: 1px solid rgba(59,130,246,.25);
    border-radius: 8px; font-size: .78rem; color: #93c5fd; line-height: 1.55;
  }
  .allowed-note strong { color: #60a5fa; }
  .allowed-note ul { list-style: none; padding: 0; margin: 6px 0 0; }
  .allowed-note li { font-family: monospace; font-size: .76rem; padding: 2px 0; color: #bfdbfe; }
</style>
</head>
<body class="admin-login-body">

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <div class="admin-login-head">
      <img src="../images/logo.png" alt="SVE" class="admin-logo" onerror="this.style.display='none'" />
      <h1>SVE Admin</h1>
      <p>Restricted access — authorized personnel only</p>
    </div>

    <div id="adminError" class="alert alert-error" hidden></div>
    <div id="adminInfo" class="alert alert-info" hidden></div>

        <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
        <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
        <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
      </svg>
      <span class="btn-text">Sign in with Google</span>
      <span class="btn-spinner" hidden></span>
    </button>

    <div class="allowed-note">
      <strong>Only allowed accounts:</strong>
      <ul>
        <li>sve.raj.in@gmail.com</li>
        <li>shidhivinayakindustry.svi@gmail.com</li>
      </ul>
    </div>

    <div class="admin-login-foot">
      <a href="../index.html">← Back to Portal</a>
    </div>
  </div>
</div>

<div id="toastBox" class="toast-box"></div>
