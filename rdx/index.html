<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login — SVE</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="../images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/rdx/css/admin.css" />
</head>
<body class="admin-login-body">

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <div class="admin-login-head">
      <img src="../images/logo.png" alt="SVE" class="admin-logo" onerror="this.style.display='none'" />
      <h1>SVE Admin Panel</h1>
      <p>Sign in with your authorized Google account.</p>
    </div>

    <div id="adminError" class="alert alert-error" hidden></div>
    <div id="adminInfo" class="alert alert-info" hidden></div>

    <button id="googleLoginBtn" class="btn-primary btn-block btn-lg" style="margin-top: 20px;">
      <span class="btn-text">Sign in with Google</span>
      <span class="btn-spinner" hidden></span>
    </button>

    <div class="admin-login-foot">
      <a href="../index.html">← Back to Main Website</a>
    </div>
  </div>
</div>

<div id="toastBox" class="toast-box"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="/rdx/js/admin-auth.js "></script>
</body>
</html>
