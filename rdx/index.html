<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SVE Admin — Login</title>
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="googlebot" content="noindex, nofollow" />
<link rel="icon" href="../images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-login-body">

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <div class="admin-login-head">
      <img src="../images/logo.png" alt="SVE" class="admin-logo" onerror="this.style.display='none'" />
      <h1>SVE Admin</h1>
      <p>Restricted access — authorized personnel only</p>
    </div>

    <form id="adminLoginForm" novalidate>
      <div class="field">
        <label>Admin Email</label>
        <input type="email" id="adminEmail" autocomplete="username" placeholder="admin@example.com" required />
      </div>

      <div class="field" style="margin-top:14px;">
        <label>Password</label>
        <div class="pass-wrap">
          <input type="password" id="adminPassword" autocomplete="current-password" placeholder="••••••••" required />
          <button type="button" class="pass-toggle" id="togglePass">👁</button>
        </div>
      </div>

      <div id="adminError" class="alert alert-error" hidden></div>
      <div id="adminInfo" class="alert alert-info" hidden></div>

      <button type="submit" class="btn-primary btn-block btn-lg" id="adminLoginBtn" style="margin-top:20px;">
        <span class="btn-text">Sign In →</span>
        <span class="btn-spinner" hidden></span>
      </button>
    </form>

    <div class="admin-login-foot">
      <a href="../index.html">← Back to Portal</a>
    </div>
  </div>
</div>

<div id="toastBox" class="toast-box"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="js/admin-auth.js"></script>
</body>
</html>
