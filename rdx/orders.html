<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orders — SVE Admin</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="../images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/rdx/css/admin.css" />
<style>
  .tabs { display: flex; gap: 6px; background: #0f172a; padding: 4px; border-radius: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tabs button { padding: 8px 16px; border-radius: 6px; font-size: .82rem; font-weight: 600; color: #94a3b8; }
  .tabs button.active { background: #1e293b; color: #fff; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar input { flex: 1; min-width: 200px; padding: 10px 14px; background: #0f172a; border: 1.5px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: .88rem; }
  .toolbar input:focus { outline: none; border-color: #3b82f6; }
</style>
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="admin-sidebar-brand">
      <img src="../images/logo.png" alt="SVE" onerror="this.style.display='none'" />
      <div class="txt"><span class="n">SVE Admin</span><span class="s">CONTROL PANEL</span></div>
    </div>
    <nav class="admin-nav">
      <a href="dashboard.html"><span class="ic">📊</span> Dashboard</a>
      <a href="applications.html"><span class="ic">📝</span> Applications</a>
      <a href="users.html"><span class="ic">👥</span> Users</a>
      <a href="products.html"><span class="ic">📦</span> Products</a>
      <a href="orders.html"><span class="ic">🛒</span> Orders</a>
      <a href="complaints.html"><span class="ic">⚠️</span> Complaints</a>
      <a href="leads.html"><span class="ic">📞</span> Leads</a>
      <a href="analytics.html"><span class="ic">📈</span> Analytics</a>
      <a href="settings.html"><span class="ic">⚙️</span> Settings</a>
    </nav>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <div class="admin-topbar-left">
        <button class="admin-hamburger" id="adminHamburger">☰</button>
        <span class="admin-page-title">Orders</span>
      </div>
      <div class="admin-topbar-right">
        <div class="admin-user"><span class="n">Admin</span><span class="e" id="adminEmail">…</span></div>
        <button class="btn-outline btn-sm" data-logout>Logout</button>
      </div>
    </header>

    <main class="admin-content">
      <div class="tabs" id="orderTabs">
        <button data-status="all" class="active">All</button>
        <button data-status="pending">Pending</button>
        <button data-status="processing">Processing</button>
        <button data-status="dispatched">Dispatched</button>
        <button data-status="delivered">Delivered</button>
        <button data-status="cancelled">Cancelled</button>
      </div>

      <div class="toolbar">
        <input type="text" id="searchBox" placeholder="Search by Order ID, customer, email…" />
      </div>

      <div class="panel">
        <div class="panel-body p-0" id="ordersBody">
          <div class="loading-block"><span class="spinner"></span> Loading…</div>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="toastBox" class="toast-box"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="/rdx/js/admin-auth.js "></script>
<script src="js/admin-orders.js"></script>
</body>
</html>
