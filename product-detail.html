<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product — SVE Business Portal</title>
<link rel="icon" href="images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/main.css" />
<style>
  .pd-wrap { padding: 40px 0 80px; }
  .pd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
  .pd-img { background: white; border: 1px solid var(--slate-100); border-radius: var(--radius); overflow: hidden; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
  .pd-img img { width: 100%; height: 100%; object-fit: cover; }
  .pd-brand { font-size: .78rem; font-weight: 700; color: var(--blue-600); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
  .pd-name { font-size: 2rem; font-weight: 800; letter-spacing: -.02em; color: var(--slate-900); margin-bottom: 12px; }
  .pd-price { font-size: 2rem; font-weight: 800; color: var(--blue-600); margin: 16px 0; }
  .pd-price small { font-size: 1rem; color: var(--slate-500); font-weight: 500; }
  .pd-desc { font-size: 1rem; color: var(--slate-700); line-height: 1.7; margin-bottom: 24px; }
  .pd-qty { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
  .pd-qty button { width: 40px; height: 40px; border-radius: 8px; border: 1.5px solid var(--slate-300); font-size: 1.2rem; font-weight: 700; color: var(--slate-700); }
  .pd-qty button:hover { border-color: var(--blue-500); color: var(--blue-600); }
  .pd-qty input { width: 70px; text-align: center; padding: 10px; border: 1.5px solid var(--slate-300); border-radius: 8px; font-weight: 700; font-size: 1rem; }
  .pd-meta { background: var(--slate-50); padding: 16px 20px; border-radius: var(--radius); font-size: .88rem; color: var(--slate-700); margin-top: 20px; }
  .pd-meta div { padding: 4px 0; }
  @media(max-width:720px){ .pd-grid{grid-template-columns:1fr;gap:24px;} .pd-name{font-size:1.5rem;} }
</style>
</head>
<body>

<header class="navbar" id="navbar">
  <div class="container nav-inner">
    <a href="index.html" class="brand">
      <img src="images/logo.png" alt="SVE" class="brand-logo" onerror="this.style.display='none'" />
      <div class="brand-text"><span class="brand-name">SVE <span class="brand-badge">B2B</span></span><span class="brand-sub">Business Portal</span></div>
    </a>
    <div class="nav-actions">
      <a href="cart.html" class="btn-ghost cart-badge" data-cart-count="0">🛒 Cart</a>
      <a href="products.html" class="btn-outline">← Products</a>
    </div>
  </div>
</header>

<section class="pd-wrap">
  <div class="container" id="pdContainer">
    <div class="loading-block"><span class="spinner"></span> Loading product…</div>
  </div>
</section>

<div id="toastBox" class="toast-box"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/main.js"></script>
<script src="js/ui.js"></script>
<script src="js/product-detail.js"></script>
</body>
</html>
