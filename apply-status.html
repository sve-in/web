<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Check Application Status — SVE Business Portal</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/main.css" />
<style>
  .status-wrap { padding: 60px 0 80px; background: linear-gradient(180deg,#f8fafc 0%, #eff6ff 100%); min-height: calc(100vh - 72px); }
  .status-card { background: white; border-radius: var(--radius-lg); padding: 40px; box-shadow: var(--shadow-lg); border: 1px solid var(--slate-100); max-width: 620px; margin: 0 auto; }
  .status-head { text-align: center; margin-bottom: 32px; }
  .status-head h1 { font-size: clamp(1.6rem,3vw,2rem); font-weight: 800; letter-spacing: -.02em; margin-bottom: 8px; }
  .status-head p { color: var(--slate-500); font-size: .96rem; }
  .status-tabs { display: flex; gap: 8px; background: var(--slate-100); padding: 4px; border-radius: var(--radius-sm); margin-bottom: 24px; }
  .status-tabs button { flex: 1; padding: 10px 16px; border-radius: 6px; font-weight: 600; font-size: .88rem; color: var(--slate-500); transition: var(--transition); }
  .status-tabs button.active { background: white; color: var(--blue-600); box-shadow: var(--shadow-sm); }

  .result-card { margin-top: 24px; border-radius: var(--radius); padding: 24px; border: 2px solid; }
  .result-pending  { background: #fffbeb; border-color: #fde68a; color: #92400e; }
  .result-approved { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
  .result-rejected { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
  .result-icon { font-size: 2.4rem; margin-bottom: 8px; }
  .result-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 6px; }
  .result-sub   { font-size: .92rem; opacity: .85; line-height: 1.5; }
  .result-detail { margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(0,0,0,.08); font-size: .88rem; }
  .result-detail div { display: flex; justify-content: space-between; padding: 4px 0; }
  .result-detail strong { font-weight: 600; }
</style>
</head>
<body>

<header class="navbar" id="navbar">
  <div class="container nav-inner">
    <a href="index.html" class="brand">
      <img src="images/logo.png" alt="SVE" class="brand-logo" onerror="this.style.display='none'" />
      <div class="brand-text">
        <span class="brand-name">SVE <span class="brand-badge">B2B</span></span>
        <span class="brand-sub">Business Portal</span>
      </div>
    </a>
    <nav class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="apply.html">Apply</a>
      <a href="login.html">Login</a>
    </nav>
    <div class="nav-actions">
      <button class="lang-toggle" id="langToggle"><span class="lang-en">EN</span><span class="lang-hi">हि</span></button>
      <a href="apply.html" class="btn-primary">Apply Now</a>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<section class="status-wrap">
  <div class="container">
    <div class="status-card">
      <div class="status-head">
        <h1>Check Application Status</h1>
        <p>Enter your phone number or Application ID to see the status.</p>
      </div>

      <div class="status-tabs">
        <button id="tabPhone" class="active">By Phone</button>
        <button id="tabAppId">By Application ID</button>
      </div>

      <!-- PHONE INPUT -->
      <div id="phonePanel">
        <div class="field">
          <label>Phone Number</label>
          <input type="tel" id="statusPhone" placeholder="10-digit mobile" maxlength="10" inputmode="numeric" />
        </div>
      </div>

      <!-- APP ID INPUT -->
      <div id="appIdPanel" style="display:none;">
        <div class="field">
          <label>Application ID</label>
          <input type="text" id="statusAppId" placeholder="e.g. SVE-APP-2026-0001" style="text-transform:uppercase;" />
        </div>
      </div>

      <button class="btn-primary btn-block btn-lg" id="checkBtn" style="margin-top:20px;">
        <span class="btn-text">Check Status</span>
        <span class="btn-spinner" hidden></span>
      </button>

      <div id="statusError" class="alert alert-error" hidden style="margin-top:16px;"></div>
      <div id="statusResult"></div>

      <div class="text-center" style="margin-top:28px;">
        <a href="index.html" class="btn-ghost">← Back to Home</a>
      </div>
    </div>
  </div>
</section>

<div id="toastBox" class="toast-box"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/main.js"></script>

<script>
(function(){
  const tabPhone = document.getElementById('tabPhone');
  const tabAppId = document.getElementById('tabAppId');
  const phonePanel = document.getElementById('phonePanel');
  const appIdPanel = document.getElementById('appIdPanel');
  let mode = 'phone';

  tabPhone.addEventListener('click', function(){
    mode='phone'; tabPhone.classList.add('active'); tabAppId.classList.remove('active');
    phonePanel.style.display=''; appIdPanel.style.display='none';
  });
  tabAppId.addEventListener('click', function(){
    mode='appId'; tabAppId.classList.add('active'); tabPhone.classList.remove('active');
    phonePanel.style.display='none'; appIdPanel.style.display='';
  });

  const checkBtn = document.getElementById('checkBtn');
  const spinner = checkBtn.querySelector('.btn-spinner');
  const btnText = checkBtn.querySelector('.btn-text');
  const errBox  = document.getElementById('statusError');
  const resBox  = document.getElementById('statusResult');

  function renderStatus(app) {
    const map = {
      pending:  { cls:'result-pending',  icon:'⏳', title:'Application Pending', sub:'Our team is reviewing your application. You will hear from us within 24–48 hours.' },
      approved: { cls:'result-approved', icon:'✅', title:'Application Approved!', sub:'Congratulations! Your account is active. Please log in with the credentials sent to your email.' },
      rejected: { cls:'result-rejected', icon:'❌', title:'Application Rejected', sub:'Unfortunately your application could not be approved at this time.' }
    };
    const m = map[app.status] || map.pending;
    let details = '';
    if (app.rejectedReason) details += '<div><span>Reason:</span><strong>' + app.rejectedReason + '</strong></div>';
    if (app.applicationId) details += '<div><span>Application ID:</span><strong>' + app.applicationId + '</strong></div>';
    if (app.businessName)  details += '<div><span>Business:</span><strong>' + app.businessName + '</strong></div>';
    details += '<div><span>Submitted:</span><strong>' + (app.createdAt ? new Date(app.createdAt.seconds*1000).toLocaleDateString() : '—') + '</strong></div>';

    let cta = '';
    if (app.status === 'approved') {
      cta = '<div style="margin-top:16px;"><a href="login.html" class="btn-primary btn-block">Login to Dashboard →</a></div>';
    }

    resBox.innerHTML =
      '<div class="result-card ' + m.cls + '">' +
        '<div class="result-icon">' + m.icon + '</div>' +
        '<div class="result-title">' + m.title + '</div>' +
        '<div class="result-sub">' + m.sub + '</div>' +
        '<div class="result-detail">' + details + '</div>' +
      '</div>' + cta;
  }

  checkBtn.addEventListener('click', async function(){
    errBox.hidden = true;
    resBox.innerHTML = '';
    const value = mode === 'phone' ? document.getElementById('statusPhone').value.trim() : document.getElementById('statusAppId').value.trim().toUpperCase();
    if (!value) { errBox.textContent='Please enter a value / कृपया मान दर्ज करें'; errBox.hidden=false; return; }

    checkBtn.disabled = true; spinner.hidden=false; btnText.textContent='Checking…';

    try {
      let query;
      if (mode === 'phone') query = window.db.collection('applications').where('phone','==',value).limit(1);
      else                  query = window.db.collection('applications').where('applicationId','==',value).limit(1);

      const snap = await query.get();
      if (snap.empty) {
        errBox.textContent = 'No application found. Please check and try again. / कोई आवेदन नहीं मिला।';
        errBox.hidden = false;
      } else {
        renderStatus(snap.docs[0].data());
      }
    } catch (e) {
      console.error(e);
      errBox.textContent = 'Could not fetch status. Try again later. / स्थिति प्राप्त नहीं हो सकी।';
      errBox.hidden = false;
    } finally {
      checkBtn.disabled = false; spinner.hidden=true; btnText.textContent='Check Status';
    }
  });
})();
</script>
<script>document.getElementById('year') && (document.getElementById('year').textContent = new Date().getFullYear());</script>
</body>
</html>
