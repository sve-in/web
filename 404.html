<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>404 — Page Not Found | SVE Business Portal</title>
<link rel="icon" href="images/logo.png" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/main.css" />
<style>
  .notfound { min-height: calc(100vh - 72px); display:flex; align-items:center; justify-content:center; text-align:center; padding: 40px 20px; background: linear-gradient(180deg,#f8fafc,#eff6ff); }
  .notfound h1 { font-size: 6rem; font-weight: 900; background: linear-gradient(135deg,#1e40af,#3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
  .notfound h2 { font-size: 1.5rem; font-weight: 800; margin: 20px 0 10px; }
  .notfound p { color: #64748b; margin-bottom: 24px; }
</style>
</head>
<body>

<header class="navbar" id="navbar">
  <div class="container nav-inner">
    <a href="index.html" class="brand">
      <img src="images/logo.png" alt="SVE" class="brand-logo" onerror="this.style.display='none'" />
      <div class="brand-text"><span class="brand-name">SVE <span class="brand-badge">B2B</span></span><span class="brand-sub">Business Portal</span></div>
    </a>
    <div class="nav-actions">
      <a href="products.html" class="btn-ghost">Products</a>
      <a href="cart.html" class="btn-ghost cart-badge" data-cart-count="0">🛒 Cart</a>
      <a href="login.html" class="btn-primary">Login</a>
    </div>
  </div>
</header>

<section class="notfound">
  <div>
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you are looking for does not exist. / आप जिस पृष्ठ की तलाश कर रहे हैं वह मौजूद नहीं है।</p>
    <a href="index.html" class="btn-primary">← Back to Home</a>
  </div>
</section>

<div id="toastBox" class="toast-box"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
